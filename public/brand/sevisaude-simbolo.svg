<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" role="img" aria-label="Símbolo SeviSaúde">
  <defs>
    <!-- Pílula central inclinada a 45° -->
    <rect
      id="sevi-pill-center"
      x="35"
      y="16"
      width="18"
      height="64"
      rx="9"
      transform="rotate(45 35 16)"
    />
    <!-- Pílula direita inclinada a -45° -->
    <rect
      id="sevi-pill-right"
      x="68"
      y="42"
      width="18"
      height="42"
      rx="9"
      transform="rotate(-45 68 42)"
    />
    <!-- Clip de sobreposição exata -->
    <clipPath id="sevi-clip">
      <use href="#sevi-pill-center" />
    </clipPath>
  </defs>

  <!-- 1. Pílula superior esquerda (paralela) -->
  <rect
    x="21"
    y="30"
    width="18"
    height="38"
    rx="9"
    transform="rotate(45 21 30)"
    fill="#40916C"
  />

  <!-- 2. Pílula central longa (verde esmeralda #40916C) -->
  <use href="#sevi-pill-center" fill="#40916C" />

  <!-- 3. Pílula direita (verde floresta #1B4332) -->
  <use href="#sevi-pill-right" fill="#1B4332" />

  <!-- 4. Sobreposição com tom intermediário #2D6A4F -->
  <g clip-path="url(#sevi-clip)">
    <use href="#sevi-pill-right" fill="#2D6A4F" />
  </g>
</svg>
