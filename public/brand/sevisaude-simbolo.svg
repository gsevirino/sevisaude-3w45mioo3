<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" role="img" aria-label="Símbolo SeviSaúde">
  <defs>
    <!-- Clip da cápsula de fundo para calcular a sobreposição -->
    <clipPath id="sevi-capsule-clip">
      <rect
        x="36"
        y="26"
        width="22"
        height="44"
        rx="11"
        transform="rotate(-45 36 26)"
      />
    </clipPath>
  </defs>

  <!-- 1. Cápsula de fundo: sálvia pálido muito claro, inclinada a -45° -->
  <rect
    x="36"
    y="26"
    width="22"
    height="44"
    rx="11"
    transform="rotate(-45 36 26)"
    fill="#E7F0E3"
    fill-opacity="0.85"
  />

  <!-- 2. Coração principal frontal: verde esmeralda #40916C -->
  <!-- Asa esquerda do coração (45°) -->
  <rect
    x="53"
    y="19"
    width="21"
    height="42"
    rx="10.5"
    transform="rotate(45 53 19)"
    fill="#40916C"
    fill-opacity="0.96"
  />

  <!-- Asa direita do coração (-45°) -->
  <rect
    x="53"
    y="19"
    width="21"
    height="42"
    rx="10.5"
    transform="rotate(-45 53 19)"
    fill="#40916C"
    fill-opacity="0.96"
  />

  <!-- 3. Zona de sobreposição translúcida com tom intermediário harmônico -->
  <g clip-path="url(#sevi-capsule-clip)">
    <rect
      x="53"
      y="19"
      width="21"
      height="42"
      rx="10.5"
      transform="rotate(45 53 19)"
      fill="#317355"
      fill-opacity="0.7"
    />
  </g>
</svg>
