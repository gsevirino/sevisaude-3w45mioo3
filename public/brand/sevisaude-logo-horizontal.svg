<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%" fill="none" role="img" aria-label="Logo SeviSaúde Horizontal">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,600;1,700&amp;display=swap');
      .brand-wordmark {
        font-family: 'Lora', 'Georgia', serif;
        font-style: italic;
      }
      .brand-sevi {
        font-weight: 600;
        fill: #26362B;
      }
      .brand-saude {
        font-weight: 700;
        fill: #4C7A5A;
      }
    </style>
    <clipPath id="sevi-h-capsule-clip">
      <rect
        x="36"
        y="26"
        width="22"
        height="44"
        rx="11"
        transform="rotate(-45 36 26)"
      />
    </clipPath>
  </defs>

  <!-- Símbolo da marca (escala 100x100 alinhado à esquerda) -->
  <g id="brand-symbol" transform="translate(10, 10)">
    <!-- 1. Cápsula de fundo -->
    <rect
      x="36"
      y="26"
      width="22"
      height="44"
      rx="11"
      transform="rotate(-45 36 26)"
      fill="#E7F0E3"
      fill-opacity="0.85"
    />

    <!-- 2. Coração frontal verde esmeralda #40916C -->
    <rect
      x="53"
      y="19"
      width="21"
      height="42"
      rx="10.5"
      transform="rotate(45 53 19)"
      fill="#40916C"
      fill-opacity="0.96"
    />
    <rect
      x="53"
      y="19"
      width="21"
      height="42"
      rx="10.5"
      transform="rotate(-45 53 19)"
      fill="#40916C"
      fill-opacity="0.96"
    />

    <!-- 3. Sobreposição intermediária -->
    <g clip-path="url(#sevi-h-capsule-clip)">
      <rect
        x="53"
        y="19"
        width="21"
        height="42"
        rx="10.5"
        transform="rotate(45 53 19)"
        fill="#317355"
        fill-opacity="0.7"
      />
    </g>
  </g>

  <!-- Wordmark "SeviSaúde" -->
  <g id="brand-wordmark" transform="translate(126, 75)">
    <text class="brand-wordmark" font-size="54" letter-spacing="-1">
      <tspan class="brand-sevi">Sevi</tspan><tspan class="brand-saude">Saúde</tspan>
    </text>
  </g>
</svg>
