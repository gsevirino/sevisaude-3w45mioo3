<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" role="img" aria-label="Símbolo SeviSaúde (versão para fundos escuros)">
  <defs>
    <!-- Clip da cápsula de fundo -->
    <clipPath id="sevi-capsule-clip-light">
      <rect
        x="36"
        y="26"
        width="22"
        height="44"
        rx="11"
        transform="rotate(-45 36 26)"
      />
    </clipPath>
  </defs>

  <!-- 1. Cápsula de fundo em tom sálvia claro translúcido -->
  <rect
    x="36"
    y="26"
    width="22"
    height="44"
    rx="11"
    transform="rotate(-45 36 26)"
    fill="#E7F0E3"
    fill-opacity="0.35"
  />

  <!-- 2. Coração frontal em verde menta luminoso #74C69D -->
  <!-- Asa esquerda do coração (45°) -->
  <rect
    x="53"
    y="19"
    width="21"
    height="42"
    rx="10.5"
    transform="rotate(45 53 19)"
    fill="#74C69D"
    fill-opacity="0.96"
  />

  <!-- Asa direita do coração (-45°) -->
  <rect
    x="53"
    y="19"
    width="21"
    height="42"
    rx="10.5"
    transform="rotate(-45 53 19)"
    fill="#74C69D"
    fill-opacity="0.96"
  />

  <!-- 3. Sobreposição luminosa intermediária #95D5B2 -->
  <g clip-path="url(#sevi-capsule-clip-light)">
    <rect
      x="53"
      y="19"
      width="21"
      height="42"
      rx="10.5"
      transform="rotate(45 53 19)"
      fill="#95D5B2"
      fill-opacity="0.75"
    />
  </g>
</svg>
