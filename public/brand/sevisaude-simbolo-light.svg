<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" role="img" aria-label="Símbolo SeviSaúde (versão para fundos escuros)">
  <defs>
    <!-- Pílula central inclinada a 45° -->
    <rect
      id="sevi-pill-center-light"
      x="35"
      y="16"
      width="18"
      height="64"
      rx="9"
      transform="rotate(45 35 16)"
    />
    <!-- Pílula direita inclinada a -45° -->
    <rect
      id="sevi-pill-right-light"
      x="68"
      y="42"
      width="18"
      height="42"
      rx="9"
      transform="rotate(-45 68 42)"
    />
    <!-- Clip de sobreposição -->
    <clipPath id="sevi-clip-light">
      <use href="#sevi-pill-center-light" />
    </clipPath>
  </defs>

  <!-- 1. Pílula superior esquerda (verde menta #74C69D) -->
  <rect
    x="21"
    y="30"
    width="18"
    height="38"
    rx="9"
    transform="rotate(45 21 30)"
    fill="#74C69D"
  />

  <!-- 2. Pílula central longa (#74C69D) -->
  <use href="#sevi-pill-center-light" fill="#74C69D" />

  <!-- 3. Pílula direita (off-white #E7F0E3) -->
  <use href="#sevi-pill-right-light" fill="#E7F0E3" />

  <!-- 4. Sobreposição com tom luminoso intermediário #95D5B2 -->
  <g clip-path="url(#sevi-clip-light)">
    <use href="#sevi-pill-right-light" fill="#95D5B2" />
  </g>
</svg>
