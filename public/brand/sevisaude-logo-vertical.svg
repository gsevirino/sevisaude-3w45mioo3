<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="100%" height="100%" fill="none" role="img" aria-label="Logo SeviSaúde Vertical com Slogan">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Lora:ital,wght@1,600;1,700&amp;display=swap');
      .brand-title {
        font-family: 'Lora', 'Georgia', serif;
        font-style: italic;
        text-anchor: middle;
      }
      .brand-sevi {
        font-weight: 600;
        fill: #26362B;
      }
      .brand-saude {
        font-weight: 700;
        fill: #4C7A5A;
      }
      .brand-slogan {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 13.5px;
        font-weight: 400;
        fill: #6B7A6F;
        text-anchor: middle;
        letter-spacing: -0.2px;
      }
    </style>
    <clipPath id="sevi-v-capsule-clip">
      <rect
        x="36"
        y="26"
        width="22"
        height="44"
        rx="11"
        transform="rotate(-45 36 26)"
      />
    </clipPath>
  </defs>

  <!-- Fundo suave arredondado idêntico ao componente vertical -->
  <rect x="110" y="10" width="120" height="120" rx="32" fill="#E7F0E3" fill-opacity="0.8" stroke="#DCE9D4" stroke-width="2" />

  <!-- Símbolo da marca centralizado dentro do fundo suave -->
  <g id="brand-symbol" transform="translate(120, 20)">
    <!-- 1. Cápsula de fundo -->
    <rect
      x="36"
      y="26"
      width="22"
      height="44"
      rx="11"
      transform="rotate(-45 36 26)"
      fill="#40916C"
      fill-opacity="0.18"
    />

    <!-- 2. Coração frontal verde esmeralda #40916C -->
    <rect
      x="53"
      y="19"
      width="21"
      height="42"
      rx="10.5"
      transform="rotate(45 53 19)"
      fill="#40916C"
      fill-opacity="0.96"
    />
    <rect
      x="53"
      y="19"
      width="21"
      height="42"
      rx="10.5"
      transform="rotate(-45 53 19)"
      fill="#40916C"
      fill-opacity="0.96"
    />

    <!-- 3. Sobreposição intermediária -->
    <g clip-path="url(#sevi-v-capsule-clip)">
      <rect
        x="53"
        y="19"
        width="21"
        height="42"
        rx="10.5"
        transform="rotate(45 53 19)"
        fill="#317355"
        fill-opacity="0.7"
      />
    </g>
  </g>

  <!-- Wordmark "SeviSaúde" centralizado -->
  <text x="170" y="185" class="brand-title" font-size="46" letter-spacing="-1">
    <tspan class="brand-sevi">Sevi</tspan><tspan class="brand-saude">Saúde</tspan>
  </text>

  <!-- Slogan oficial -->
  <text x="170" y="218" class="brand-slogan">
    Sua jornada de saúde, conectada.
  </text>
</svg>
