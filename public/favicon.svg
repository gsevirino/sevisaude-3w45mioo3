<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <clipPath id="fav-clip">
      <rect
        x="36"
        y="26"
        width="22"
        height="44"
        rx="11"
        transform="rotate(-45 36 26)"
      />
    </clipPath>
  </defs>

  <!-- Cápsula de fundo em sálvia suave -->
  <rect
    x="36"
    y="26"
    width="22"
    height="44"
    rx="11"
    transform="rotate(-45 36 26)"
    fill="#E7F0E3"
    fill-opacity="0.9"
  />

  <!-- Coração frontal em verde esmeralda #40916C -->
  <rect
    x="53"
    y="19"
    width="21"
    height="42"
    rx="10.5"
    transform="rotate(45 53 19)"
    fill="#40916C"
  />
  <rect
    x="53"
    y="19"
    width="21"
    height="42"
    rx="10.5"
    transform="rotate(-45 53 19)"
    fill="#40916C"
  />

  <!-- Sobreposição com tom intermediário harmônico -->
  <g clip-path="url(#fav-clip)">
    <rect
      x="53"
      y="19"
      width="21"
      height="42"
      rx="10.5"
      transform="rotate(45 53 19)"
      fill="#317355"
      fill-opacity="0.75"
    />
  </g>
</svg>
